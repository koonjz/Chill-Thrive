<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book a Session | Chill Thrive</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
</head>

<body>

<header>
  <nav class="container nav">
    <h2 class="logo">
      <a href="index.html" class="logo-link">
        <img src="https://i.ibb.co/gMFZYF97/chill-thrive-logo.jpg" class="logo-img">
        Chill Thrive
      </a>
    </h2>
  </nav>
</header>

<section class="container section">
  <div class="card">
    <form id="bookingForm">

      <h3>1. Service</h3>
      <select id="service" required>
        <option value="">Select Service</option>
        <option>Ice Bath Therapy</option>
        <option>Jacuzzi Therapy</option>
        <option>Steam Bath</option>
        <option>Ice Bath + Steam</option>
        <option>Ice Bath + Jacuzzi</option>
        <option>Full Recovery Combo</option>
      </select>

      <div id="duration-wrapper">
        <select id="duration">
          <option value="">Select Duration</option>
          <option value="30">30 Minutes</option>
          <option value="60">60 Minutes</option>
        </select>
      </div>

      <h3>2. Date & Time</h3>
      <input type="date" id="date" required>
      <select id="time" required>
        <option value="">Select Time</option>
      </select>

      <h3>3. Details</h3>
      <input type="text" id="name" placeholder="Name" required>
      <input type="tel" id="phone" placeholder="Phone" required>
      <input type="email" id="email" placeholder="Email" required>

      <button class="btn" type="submit">Confirm Booking</button>

    </form>
  </div>
</section>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="./app.js"></script>

</body>
</html>
